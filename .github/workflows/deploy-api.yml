name: Deploy API to Vercel

# The API runs as a Vercel serverless function (Railway's trial expired, so the
# original Railway deploy is retired). Same pattern as deploy-web.yml: the runner
# uploads the checked-out code with the Vercel CLI, which works with a private
# org repo on the Hobby plan. Deploys the kimi-hr-api project (rootDirectory
# apps/api; Express app wrapped by apps/api/api/index.js per apps/api/vercel.json).
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_4meLkHZuHu0i2boCKXLISF8g
      VERCEL_PROJECT_ID: prj_6KCjz1zkMOXJC5pe3C0lsr76115D
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Vercel CLI
        run: npm i -g vercel
      - name: Deploy to Vercel (production)
        # Drop the checked-out .git so Vercel attributes the deploy to the token
        # owner (team owner) instead of the commit author, who may not hold a team
        # seat — otherwise the deploy is BLOCKED with TEAM_ACCESS_REQUIRED.
        run: |
          rm -rf .git
          vercel deploy --prod --token="$VERCEL_TOKEN" --yes
