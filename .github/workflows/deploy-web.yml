name: Deploy Web to Vercel

# The repo is private and org-owned, so Vercel's native Git integration can't be
# connected on the Hobby plan ("repo_owned_by_org — Upgrade to Pro"). Instead the
# GitHub Actions runner checks out the code and uploads it with the Vercel CLI
# (`vercel deploy`), which needs no Vercel<->GitHub connection. Same mechanism we
# verified by hand. Deploys the kimi-hr-web project (rootDirectory apps/web).
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

# Only the latest push to main needs to deploy; cancel superseded runs.
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_4meLkHZuHu0i2boCKXLISF8g
      VERCEL_PROJECT_ID: prj_nMcTsKA0OlPUSSjNTyUS9IF2Jq8J
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Vercel CLI
        run: npm i -g vercel
      - name: Deploy to Vercel (production)
        run: vercel deploy --prod --token="$VERCEL_TOKEN" --yes
